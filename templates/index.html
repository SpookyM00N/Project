<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Image Enhancer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner container">
      <span class="logo" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1.5" y="3" width="21" height="18" rx="3" fill="#fff" />
          <path d="M7 8h10M7 12h10M7 16h6" stroke="#b91c1c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="18.5" cy="6.5" r="0.9" fill="#b91c1c"/>
        </svg>
      </span>
      <h1 class="app-title">Image Enhancer</h1>
    </div>
  </header>

  <main class="container" style="padding-top:120px;">
    <section class="uploader card">
      <label class="file-control">
        <input id="file" type="file" accept="image/*">
        <span class="file-btn">Upload an image</span>
      </label>

      <div class="settings-panel" id="settings-panel" style="width:100%; max-width:400px; margin: 15px 0; display:none;">
        <div class="control-group">
          <label for="sharpness">Sharpness Balance</label>
          <input type="range" id="sharpness" min="0.5" max="2.5" step="0.1" value="1.2">
        </div>
        <div class="control-group">
          <label for="contrast">Contrast Intesity</label>
          <input type="range" id="contrast" min="0.5" max="2.0" step="0.1" value="1.1">
        </div>
        <div class="control-group">
          <label for="vibrancy">Vibrancy / Saturation</label>
          <input type="range" id="vibrancy" min="0.5" max="2.0" step="0.1" value="1.3">
        </div>
      </div>

      <div class="actions">
        <button id="enhance" class="btn primary">Enhance</button>
        <span id="status" class="status"></span>
      </div>
    </section>

    <section class="preview card" id="comparison" hidden>
      <div class="preview-column">
        <h3>Original</h3>
        <img id="original" class="img-preview" alt="Original image">
      </div>
      <div class="preview-column">
        <h3>Enhanced</h3>
        <img id="enhanced" class="img-preview" alt="Enhanced image">
        <a id="download" class="btn secondary" download>Download Enhanced</a>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
